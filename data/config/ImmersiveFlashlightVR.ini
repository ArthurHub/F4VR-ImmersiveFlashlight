[ImmersiveFlashlightVR]

# README
# https://github.com/arthurhub/F4VR-ImmersiveFlashlight/wiki
#
# ---------------
# Live Reload:
# Any change to the file while the game is running will be detected and applied immediately.
# Useful to modify advanced settings and seeing the effects without restarting the game.
#
# ---------------------
# Input Binding Format:
# Controller bindings are a single, case-insensitive line:
#   "<hand> <type> <button> [duration] [+[hand:]modifier]"
#
#   hand     = primary | offhand | left | right
#   type     = tap | press | release | longpress | double | hold | touch | axis
#   button   = trigger | grip | a | b (menu) | thumbstick | system
#   duration = optional seconds; meaning depends on type (e.g. longpress hold threshold)
#   modifier = optional button held while the binding fires:
#              "+grip" on the same hand, or "+offhand:grip" on a specific hand
#
# Disable a binding with "none", "off", "disabled", or an empty value -> it never fires.
#
# Examples:
#   offhand tap grip             -> quick press+release of the offhand grip
#   primary longpress a 0.6      -> hold the primary A button for 0.6s
#   primary press trigger +grip  -> press trigger while holding grip on the same hand
#   none                         -> binding disabled (never fires)


# Controls the characteristics of the flashlight light separate for when it a head lamp, hand flashlight, or weapon attachment.
# The idea is to have wide and soft light when it's a head lamp for tight places and more of far seeing but tight
# hand flashlight for walking in the dark, and more "tactical" light for weapon attachment.
# Default: 1.1, 2000, 90, 235, 224, 190

# Fade: the intensity of the light beam
fFlashlightOnHeadFade = 1.100000

# Radius: how far the light makes object visible
iFlashlightOnHeadRadius = 2000

# FOV: the spread of the light beam - how wide / narrow the beam is
fFlashlightOnHeadFov = 90.000000

# The gobo texture path for the flashlight
sFlashlightOnHeadGoboPath = data\Textures\ImmersiveFlashlightVR\Gobos\6_Incandescent.DDS

# The RGB color values of the light
iFlashlightOnHeadColorRed = 235
iFlashlightOnHeadColorGreen = 224
iFlashlightOnHeadColorBlue = 190

# Same as above but for when the flashlight is on the head while in power armor
fFlashlightOnPAHeadFade = 1.300000
iFlashlightOnPAHeadRadius = 5000
fFlashlightOnPAHeadFov = 90.000000
sFlashlightOnPAHeadGoboPath = data\Textures\ImmersiveFlashlightVR\Gobos\5_F4_PA_Bright.DDS
iFlashlightOnPAHeadColorRed = 235
iFlashlightOnPAHeadColorGreen = 224
iFlashlightOnPAHeadColorBlue = 190

# Same as above but for when the flashlight is in offhand
# Default: 1.4, 7000, 60, 240, 230, 225
fFlashlightInHandFade = 1.4
iFlashlightInHandRadius = 7000
fFlashlightInHandFov = 60
sFlashlightInHandGoboPath = data\Textures\ImmersiveFlashlightVR\Gobos\6_Incandescent.DDS
iFlashlightInHandColorRed = 240
iFlashlightInHandColorGreen = 230
iFlashlightInHandColorBlue = 225

# Same as above but for when the flashlight is in primary hand
# Default: 1.8, 3500, 45, 235, 225, 215
fFlashlightOnWeaponFade = 1.8
iFlashlightOnWeaponRadius = 3500
fFlashlightOnWeaponFov = 45
sFlashlightOnWeaponGoboPath = data\Textures\ImmersiveFlashlightVR\Gobos\4_F4_PA_Dim.DDS
iFlashlightOnWeaponColorRed = 210
iFlashlightOnWeaponColorGreen = 255
iFlashlightOnWeaponColorBlue = 210

# Pose of the flashlight light node per mount location.
# Format: x,y,z;heading,roll,attitude;scale (translation in game units, rotation in degrees).
# Head/PAHead: applied directly to the light node's local transform (tilts the beam).
# InOffhand/InPrimaryHand: rotate + position offset relative to the wand node, configured
# independently per hand and per grip style (Forward vs Overhand).
tFlashlightOnHeadTransform = 0,0,0;0,-5,0;1
tFlashlightOnPAHeadTransform = 0,0,0;0,-5,0;1
tFlashlightInOffhandTransform = 5,-2,-2;0,-30,-85;1
tFlashlightInPrimaryHandTransform = 5,1.4,-2;0,-30,-95;1

# Overhand (fist / ice-pick) grip variants. Used when the wand's forward axis pitches below
# fFlashlightGripOverhandPitchDegrees (auto-detect mode), or always when iFlashlightGripMode = 2.
tFlashlightInOffhandTransformOverhand = 12,2,-2;0,-30,95;1
tFlashlightInPrimaryHandTransformOverhand = 12,1.5,-1.5;0,-30,95;1

# Power armor variants of the in-hand light transforms. PA gauntlets are larger and sit differently
# than bare hands, so the beam needs its own offsets. If a key is omitted it falls back to the
# matching non-PA transform above. Only used while the player is in power armor.
tFlashlightInOffhandTransformPA = 7,-4.5,1;0,-30,-85;1
tFlashlightInPrimaryHandTransformPA = 7,4,0;0,-30,-95;1
tFlashlightInOffhandTransformOverhandPA = 14,5.5,-1;0,-30,95;1
tFlashlightInPrimaryHandTransformOverhandPA = 14,-1.5,-0.5;0,-30,95;1

# The distance at which the flashlight starts to effect objects, including creating shadows
# Use to prevent player hands, head, equipment casting shadows from hand held flashlight (Default: 20)
fFlashlightNearDistance = 20

# Change the Pipboy flashlight to be on your left/right arm or head (0 - head, 1 - offhand, 2 - primary hand)
# Controlled in-game by the body grab (-> hand) and head activation (-> head); see those sections below.
# iFlashlightLocation applies when OUT of power armor, iFlashlightLocationInPA when IN power armor.
# The two are tracked separately, so switching location in power armor doesn't change your out-of-PA choice.
iFlashlightLocation = 1
iFlashlightLocationInPA = 0

# Bitmask flags to control various flashlight behaviors like type of shadow, flicker, etc.
# See code ref: https://github.com/ArthurHub/CommonLibF4VR/blob/eab8561631fe8985ae532617f98a7e7255a61448/CommonLibF4/include/RE/Bethesda/TESBoundAnimObjects.h#L20
# Default: 0000010000100001 (kDynamic | kOffByDefault | kSpotShadow)
# No Shadows: 0100000000100001 (kNonShadowSpot | kOffByDefault | kSpotShadow)
sFlashlightFlagsBitmask = 0000010000100001

# Show a warning when VRFPSStabilizerFallout is detected because it can break flashlight shadows
bWarnAboutFPSStabilizerMod = true

# Show a 3D flashlight model in the player's hand when the flashlight is in a hand mode (offhand or primary hand)
bShowFlashlightMesh = true

# Primary-hand pose of the flashlight mesh relative to the VR controller node, for the Forward grip.
# Format: x,y,z;heading,roll,attitude;scale (translation in game units, rotation in degrees)
# Offhand mirrors Z translation and heading at attach time.
tFlashlightMeshTransform = 6.72,-2.21,-1.69;30.00,0.00,90.00;1.30

# Overhand (fist / ice-pick) grip variant.
tFlashlightMeshTransformOverhand = 6.72,-1.69,1.00;-90.00,0.00,0.00;1.30

# Power armor variants of the mesh transforms. Fall back to the matching non-PA transform above
# when omitted. Only used while the player is in power armor.
tFlashlightMeshTransformPA = 8.45,-4.94,-4.51;30.00,0.00,90.00;1.50
tFlashlightMeshTransformOverhandPA = 6.57,-5.47,0.56;-90.00,0.00,0.00;1.50

# Hand pose applied via FRIK API while holding the flashlight (Forward grip).
# 22 floats: 5 ';'-separated finger groups (thumb,index,middle,ring,pinky), each as prox,mid,dist,splay
# (0.0 = fully bent/closed, 1.0 = fully straight/open), then 2 trailing palmPitch,palmYaw.
hFlashlightHandPose = 0.48,1.14,0.97,0.06;0.56,0.56,0.29,0.11;0.17,0.55,0.62,0.03;-0.31,0.87,0.53,0.03;-0.67,0.96,1.14,0.16;5.00,0.00

# Overhand grip pose — default is a closed fist around the flashlight body. Tune to taste.
hFlashlightHandPoseOverhand = 0.99,0.41,0.56,0.04;0.29,0.41,0.40,0.10;0.20,0.43,0.31,0.12;0.41,0.42,0.36,0.15;0.76,0.23,0.72,0.11;0.00,0.00

# Power armor variants of the hand poses. PA gauntlets pose differently than bare hands, so tune
# these separately. Fall back to the matching non-PA pose above when omitted. In power armor only.
hFlashlightHandPosePA = 1.14,0.45,0.60,0.08;0.38,0.56,0.29,0.11;-0.04,0.55,0.62,0.03;-0.41,0.87,0.53,0.03;-0.67,0.96,1.14,0.16;5.00,0.00
hFlashlightHandPoseOverhandPA = 1.26,-0.80,0.02,-0.48;0.29,0.46,0.40,0.22;0.20,0.43,0.31,0.32;0.41,0.43,0.36,0.35;0.76,0.23,0.72,0.48;0.00,0.00

# Grip-style mode: 0 = Auto (detect from controller orientation), 1 = ForwardOnly, 2 = OverhandOnly
iFlashlightGripMode = 0

# Auto-detect threshold: angle (degrees) between the controller's top axis and world up.
# Switch to Overhand when the tilt exceeds this value. 120 means the wrist must roll the controller
# at least 120 degrees away from upright.
fFlashlightGripOverhandTiltDegrees = 120

# Hysteresis band (degrees) subtracted from the threshold for the switch back to Forward.
# Larger = more stable but switches feel less responsive.
fFlashlightGripHysteresisDegrees = 60


# -------------------------------------------------------------------------------------------------
# Body stow & head activation (grab the flashlight on/off, no menus)
# A beam-less model sits on your body while the light is off: reach a hand into its grab zone and fire the
# grab binding to take the light into that hand; grab again in the same spot to put it back (off). Or bring
# the OFFHAND near your head and fire its binding to put the light on your head (on from off, moved from a
# hand, or off when already on the head). A hand in a zone has its binding button intercepted so it won't
# fire its normal action. These are the primary way to move the light; the grip-based switches below are an
# optional extra. Tune live; set bDebugShowGrabSphere to see the zones. Sphere scale = diameter; transforms
# are right-handed and auto-mirrored when left-handed (the head zone is centered, so it isn't mirrored).

# Show the stowed model on the body (also enables the body grab).
bShowFlashlightOnBody = true

# Stowed model transform on the chest bone (+PA variant).
tFlashlightBodyTransform = -10.12,8.71,8.58;46.90,-3.25,-14.13;1.40
tFlashlightBodyTransformPA = -0.41,15.14,11.94;43.79,0.00,-7.12;1.50

# Body grab zone, offset from the stowed model (+PA variant).
tFlashlightGrabSphereTransform = 3.91,7.11,0.67;0.00,0.00,0.00;20.00
tFlashlightGrabSphereTransformPA = 4.01,10.21,-4.60;0.00,0.00,0.00;24.00

# Head activation zone, in HMD-local space (no PA variant — the HMD sits the same in/out of power armor).
tFlashlightHeadSphereTransform = 0,0,0;0,0,0;24

# Render both zones at their exact size/location to tune the transforms above.
bDebugShowGrabSphere = false

# Input bindings (see "Input Binding Format" at the top); set any to "none" to disable that gesture.
# Grab/return goes to whichever hand grabbed it; head activation is offhand-only.
sGrabFlashlightByOffhandBinding = offhand tap trigger
sGrabFlashlightByPrimaryHandBinding = primary tap trigger
sActivateFlashlightOnHeadBinding = offhand tap trigger
sSwitchFlashlightBetweenHandsBinding = offhand tap trigger

# Legacy hand <-> head location switching while the flashlight is *on* (see "Input Binding Format" at the top).
# Each gesture is independent and disabled by setting its binding to "none".
sSwitchFlashlightHeadPrimaryHandBinding = none
sSwitchFlashlightHeadOffhandBinding = none



[Debug]

# The level of log message to output; 2 - info (basic), 1 - debug (more logs), 0 - trace (A LOT of logs)
iLogLevel = 1

# The pattern and data in each log messages (default: "%H:%M:%S.%e %L: %v")
# Additional options: %s:%# for source file and line number. Example: "%H:%M:%S.%e %L [%-25s:%-4#]: %v"
sLogPattern = %H:%M:%S.%e %l: %v

# General usage debug flag to enable/disable code paths at runtime (use in combination with ReloadConfigInterval)
fDebugFlowFlag1 =
fDebugFlowFlag2 =
fDebugFlowFlag3 =
sDebugFlowText1 =
sDebugFlowText2 =

# In-game DebugAdjuster target. When non-none, controller input mutates the selected value live.
# Values: none | flag123 | transform | handpose | flag1 | flag2 | flag3 | haptictest
#   ...or a "Section::Key" reference to tune ANY INI field live e.g. ImmersiveFlashlightVR::tFlashlightInOffhandTransform
# Bindings (target=transform): primary stick = translate XY, secondary stick Y = translate Z;
#   hold offhand-grip for rotate; hold offhand-A for scale.
# Bindings (target=handpose): one slot active at a time (finger or palm).
#   Active finger: primary X=prox, primary Y=mid, secondary X=dist, secondary Y=splay.
#   Active palm:   primary X=palmPitch, primary Y=palmYaw.
#   Offhand-X short release: advance slot (thumb->index->middle->ring->pinky->palm->thumb).
# Bindings (target=flag123): primary X = flag1, primary Y = flag2, secondary Y = flag3.
# Bindings (target=haptictest): Primary-A tap plays the HapticSegment sequence in sDebugFlowText1
#   on the primary controller. Format: ';'-separated segments "duration,startIntensity,endIntensity"
#   (seconds, 0..1, 0..1), e.g. sDebugFlowText1 = 0.4,0.1,1.0; 0.1,0,0; 0.05,1,1
# Primary-A short tap = save to INI; Primary-A long press = reload from INI (except target=haptictest).
sDebugAdjustTarget =

# Dump specific data into logs by name
# Names: ui_tree, skelly, fp_skelly, geometry, world, all_nodes
sDebugDumpDataOnceNames =

# Internal use for versioning
iVersion = 10
