# README
# https://github.com/ArthurHub/F4VR-ImmersiveFlashlight/blob/main/docs/README.md
#
# ---------------
# Live Reload:
# Any change to the file while the game is running will be detected and applied immediately.
# Useful to modify advanced settings and seeing the effects without restarting the game.
#
# ---------------
# Format (TOML):
# Text values are in quotes: "wheninside". A Windows path goes in single quotes, where a backslash is just a
# backslash: 'data\Textures\Effects\Gobos\FlashlightGobo01.dds'.
# A transform (t...) is { pos = [x, y, z], rot = [heading, roll, attitude], scale = s }: translation in game units,
# rotation in degrees, each key optional.
# A color (c...) is { rgb = [r, g, b] }, each a whole number in 0..255.


# -------------------------------------------------------------------------------------------------
# Main section holds the common settings most players touch.
[ImmersiveFlashlightVR]

# Change the Pipboy flashlight to be on your left/right arm or head (0 - head, 1 - offhand, 2 - primary hand)
# Controlled in-game by the body grab (-> hand) and head activation (-> head); see the activation-sphere sections.
# iFlashlightLocation applies when OUT of power armor, iFlashlightLocationInPA when IN power armor.
# The two are tracked separately, so switching location in power armor doesn't change your out-of-PA choice.
iFlashlightLocation = 1
iFlashlightLocationInPA = 0

# -------------------------------------------------------------------------------------------------
# Beam appearance per mount location
#
# Controls the characteristics of the flashlight light separate for when it is a head lamp, hand flashlight, or weapon attachment.
# The idea is to have wide and soft light when it's a head lamp for tight places and more of far seeing but tight
# hand flashlight for walking in the dark, and more "tactical" light for weapon attachment.
#
# Fade: the intensity of the light beam
# Radius: how far the light makes object visible
# FOV: the spread of the light beam - how wide / narrow the beam is
# The gobo texture path for the flashlight
# Color: the light's color as { rgb = [r, g, b] }, each 0..255
# Transform tilts the light node (see the transform format at the top).
#

# Head. Default: 1.1, 2000, 90, 235, 224, 190, 6_Incandescent.DDS
fFlashlightOnHeadFade = 1.1
iFlashlightOnHeadRadius = 2000
fFlashlightOnHeadFov = 90.0
sFlashlightOnHeadGoboPath = 'data\Textures\ImmersiveFlashlightVR\Gobos\6_Incandescent.DDS'
cFlashlightOnHeadColor = { rgb = [235, 224, 190] }
tFlashlightOnHeadTransform = { pos = [0.0, 0.0, 0.0], rot = [0.0, -5.0, 0.0], scale = 1.0 }

# Head while in power armor. Default: 1.3, 5000, 90, 235, 224, 190, 5_F4_PA_Bright.DDS
fFlashlightOnPAHeadFade = 1.3
iFlashlightOnPAHeadRadius = 5000
fFlashlightOnPAHeadFov = 90.0
cFlashlightOnPAHeadColor = { rgb = [235, 224, 190] }
sFlashlightOnPAHeadGoboPath = 'data\Textures\ImmersiveFlashlightVR\Gobos\5_F4_PA_Bright.DDS'
tFlashlightOnPAHeadTransform = { pos = [0.0, 0.0, 0.0], rot = [0.0, -5.0, 0.0], scale = 1.0 }

# In hand (offhand or primary hand). Default: 1.4, 7000, 60, 240, 230, 225, 6_Incandescent
# The in-hand light-node position/mesh/pose are ADVANCED - see [ImFl_HandMount] below.
fFlashlightInHandFade = 1.4
iFlashlightInHandRadius = 7000
fFlashlightInHandFov = 60.0
cFlashlightInHandColor = { rgb = [240, 230, 225] }
sFlashlightInHandGoboPath = 'data\Textures\ImmersiveFlashlightVR\Gobos\6_Incandescent.DDS'

# On weapon. Default: 1.8, 3500, 45, 255, 255, 255, 4_F4_PA_Dim
# The weapon-mount rules and beam position are ADVANCED - see [ImFl_WeaponMount] below.
fFlashlightOnWeaponFade = 1.8
iFlashlightOnWeaponRadius = 3500
fFlashlightOnWeaponFov = 45.0
cFlashlightOnWeaponColor = { rgb = [255, 255, 255] }
sFlashlightOnWeaponGoboPath = 'data\Textures\ImmersiveFlashlightVR\Gobos\4_F4_PA_Dim.DDS'

# -------------------------------------------------------------------------------------------------
# Global light properties (apply to every beam)
#

# The distance at which the flashlight starts to effect objects, including creating shadows
# Use to prevent player hands, head, equipment casting shadows from hand held flashlight (Default: 20)
fFlashlightNearDistance = 20.0

# Bitmask flags to control various flashlight behaviors like type of shadow, flicker, etc.
# See code ref: https://github.com/ArthurHub/CommonLibF4VR/blob/eab8561631fe8985ae532617f98a7e7255a61448/CommonLibF4/include/RE/Bethesda/TESBoundAnimObjects.h#L20
# Default: "0000010000100001" (kDynamic | kOffByDefault | kSpotShadow)
# No Shadows: "0100000000100001" (kNonShadowSpot | kOffByDefault | kSpotShadow)
sFlashlightFlagsBitmask = "0000010000100001"

# Show a warning when VRFPSStabilizerFallout is detected because it can break flashlight shadows
bWarnAboutFPSStabilizerMod = true

# -------------------------------------------------------------------------------------------------
# Global toggles
#

# Disable the vanilla game's global flashlight toggle so only this mod's gestures control the light.
bDisableVanillaFlashlightToggle = false

# Keep the flashlight on while the Pip-Boy is open. The vanilla game turns it off while the Pip-Boy is open
# (except in power armor) and back on when it closes; set to false for that.
bKeepFlashlightOnInPipboy = true

# Force every activation sphere to always render at its true size, for tuning (a global master over the
# [ImFl_*ActivationSphere] sections at the bottom of the file). Overrides each sphere's own sShowSphere and
# fSphereScale; icons are left as configured.
bShowAllActivationSpheres = false


# -------------------------------------------------------------------------------------------------
# ADVANCED: Visible beam glow
# The soft cone of light shown at the hand-held flashlight's lens and at a weapon's lamp. It takes the
# active beam's color, and its brightness and spread follow the beam's Fade and FOV above.
[ImFl_BeamGlow]

# Glow brightness: fBeamGlowBaseIntensity + beam Fade x fBeamGlowIntensity. The base keeps the glow visible
# at any Fade, so the Fade only shades it. Both 0 hides the glow.
fBeamGlowBaseIntensity = 0.2
fBeamGlowIntensity = 0.15

# How many degrees narrower than the beam FOV the glow is. The gobo darkens the beam's edge, so the visibly
# lit cone is narrower than the FOV. The glow comes in 20-90 degree meshes in steps of 5, rounded down.
fBeamGlowFovOffset = 5.0


# -------------------------------------------------------------------------------------------------
# ADVANCED: In-hand flashlight placement, model and grip
# The light-node offset, the visible 3D model, the FRIK hand pose, and the auto grip-style detection
# used when the flashlight is held in the offhand or primary hand.
[ImFl_HandMount]

# Pose of the flashlight light node relative to the wand node, per hand, for the Forward grip.
# Format: { pos = [x, y, z], rot = [heading, roll, attitude], scale = s } (translation in game units, rotation in degrees).
# Used only while the flashlight model isn't shown (bShowFlashlightMesh = false, or the hand is posed for
# something else): with the model shown, the light leaves its lens along the beam glow.
tFlashlightInOffhandTransform = { pos = [4.76, -1.97, -5.04], rot = [0.0, -40.0, -85.0], scale = 1.0 }
tFlashlightInPrimaryHandTransform = { pos = [4.45, 0.58, -5.3], rot = [0.0, -40.0, -95.0], scale = 1.0 }

# Overhand (fist / ice-pick) grip variants. Used when the wand's forward axis pitches below
# fFlashlightGripOverhandTiltDegrees (auto-detect mode), or always when iFlashlightGripMode = 2.
tFlashlightInOffhandTransformOverhand = { pos = [11.94, 1.31, -0.93], rot = [-2.52, -34.47, 95.33], scale = 1.0 }
tFlashlightInPrimaryHandTransformOverhand = { pos = [11.48, -0.51, 0.28], rot = [-6.29, -35.57, 84.77], scale = 1.0 }

# Show a 3D flashlight model in the player's hand when the flashlight is in a hand mode (offhand or primary hand)
bShowFlashlightMesh = true

# Pose of the flashlight mesh relative to the hand bone, for the Forward grip, authored for the right hand.
# Format: { pos = [x, y, z], rot = [heading, roll, attitude], scale = s } (translation in game units, rotation in degrees)
# The off-side hand mirrors Z translation and heading at attach time (left-handed-aware).
tFlashlightMeshTransform = { pos = [7.0, -1.97, -2.16], rot = [22.0, 0.0, 90.0], scale = 1.3 }

# Overhand (fist / ice-pick) grip variant.
tFlashlightMeshTransformOverhand = { pos = [6.72, -1.69, 1.0], rot = [-90.0, 0.0, 0.0], scale = 1.3 }

# Power armor variants of the mesh transforms. Fall back to the matching non-PA transform above
# when omitted. Only used while the player is in power armor.
tFlashlightMeshTransformPA = { pos = [9.37, -5.86, -5.13], rot = [20.72, 0.0, 90.0], scale = 1.5 }
tFlashlightMeshTransformOverhandPA = { pos = [6.57, -5.47, 0.56], rot = [-90.0, 0.0, 0.0], scale = 1.5 }

# Hand pose applied via FRIK API while holding the flashlight (Forward grip).
# Each finger (thumb, index, middle, ring, pinky) is [prox, mid, dist, splay] (0.0 = fully bent/closed,
# 1.0 = fully straight/open), and palm is [pitch, yaw]. A finger or the palm left out is zeros.
hFlashlightHandPose = { thumb = [0.48, 1.14, 0.97, 0.06], index = [0.75, 0.56, 0.29, 0.23], middle = [0.17, 0.55, 0.62, 0.03], ring = [-0.38, 0.87, 0.53, 0.03], pinky = [-0.8, 0.96, 1.14, 0.16], palm = [15.0, 0.0] }

# Overhand grip pose — default is a closed fist around the flashlight body. Tune to taste.
hFlashlightHandPoseOverhand = { thumb = [0.99, 0.41, 0.56, 0.04], index = [0.29, 0.41, 0.4, 0.1], middle = [0.2, 0.43, 0.31, 0.12], ring = [0.41, 0.42, 0.36, 0.15], pinky = [0.76, 0.23, 0.72, 0.11], palm = [0.0, 0.0] }

# Power armor variants of the hand poses. PA gauntlets pose differently than bare hands, so tune
# these separately. Fall back to the matching non-PA pose above when omitted. In power armor only.
hFlashlightHandPosePA = { thumb = [1.68, 0.24, 0.19, 0.14], index = [0.9, 0.56, 0.29, 0.31], middle = [0.39, 0.35, 0.62, 0.03], ring = [-0.12, 0.7, 0.53, 0.03], pinky = [-0.67, 0.96, 1.14, 0.16], palm = [15.0, 0.0] }
hFlashlightHandPoseOverhandPA = { thumb = [1.26, -0.8, 0.02, -0.48], index = [0.29, 0.46, 0.4, 0.22], middle = [0.2, 0.43, 0.31, 0.32], ring = [0.41, 0.43, 0.36, 0.35], pinky = [0.76, 0.23, 0.72, 0.48], palm = [0.0, 0.0] }

# Grip-style mode: 0 = Auto (detect from controller orientation), 1 = ForwardOnly, 2 = OverhandOnly
iFlashlightGripMode = 0

# Auto-detect threshold: angle (degrees) between the controller's top axis and world up.
# Switch to Overhand when the tilt exceeds this value. 120 means the wrist must roll the controller
# at least 120 degrees away from upright.
fFlashlightGripOverhandTiltDegrees = 120.0

# Hysteresis band (degrees) subtracted from the threshold for the switch back to Forward.
# Larger = more stable but switches feel less responsive.
fFlashlightGripHysteresisDegrees = 60.0


# -------------------------------------------------------------------------------------------------
# ADVANCED: Head flashlight headgear restriction
# Optionally require headgear before the flashlight may sit on your head, OUT of power armor only
# (in power armor the helmet lamp always applies). When the requirement isn't met the head light is
# turned off and the head-activation gesture is inert until you wear eligible headgear.
[ImFl_HeadgearRestriction]

#   0 = None       - no restriction (the head is always available)
#   1 = AnyHeadGear- any headgear in the head slot is enough
#   2 = Immersive  - only "light-capable" headgear: helmets/hard hats, not soft hats. The rule is:
#                    !inDenyList && ( inAllowList || hasAnyKeyword(aHeadLightKeywords) )
iFlashlightHeadgearRequirement = 2

# Immersive rule, keyword set: base-game keyword EDITOR IDs (keywords keep their editor
# IDs at runtime). Any headgear carrying one of these counts as light-capable.
aHeadLightKeywords = ["ArmorBodyPartHead", "ObjectTypeArmor", "ArmorTypePower", "PowerArmorHelmetLightOverride"]

# Immersive rule, force-INCLUDE list: light-worthy headgear the keywords miss, as
# "localFormID|plugin" entries (local FormID as shown in xEdit, hex, no load-order prefix). Resolved
# load-order-independently, so entries for plugins you don't have are simply ignored.
# Add your own, e.g. SS2 security/gas-mask helms: "0026D8|SS2Extended.esp", "0026DA|SS2Extended.esp", "004544|SS2Extended.esp"
aHeadLightAllowList = [
    "0F6D86|Fallout4.esm",
    "0CEAC4|Fallout4.esm",
    "115AEB|Fallout4.esm",
    "04FA89|DLCCoast.esm",
    "0540FC|DLCCoast.esm",
    "0296B8|DLCNukaWorld.esm",
    "029C0D|DLCNukaWorld.esm",
    "02770C|DLCNukaWorld.esm",
    "02770D|DLCNukaWorld.esm",
    "02770E|DLCNukaWorld.esm",
    "027419|DLCNukaWorld.esm",
    "02740F|DLCNukaWorld.esm",
    "03B557|DLCNukaWorld.esm",
    "026BB0|DLCNukaWorld.esm",
    "026BB5|DLCNukaWorld.esm",
    "026BB6|DLCNukaWorld.esm",
    "026BB7|DLCNukaWorld.esm",
]

# Immersive rule, force-EXCLUDE list: headgear that carries a helmet keyword but where a light is silly
# (soft hats). Same "localFormID|plugin" format; the deny list wins over keywords and the allow list.
# Add your own, e.g. SS2 hats: "0A506D|SS2.esm", "02F990|SS2_XPAC_Chapter2.esm", "0026DD|SS2Extended.esp"
aHeadLightDenyList = ["0316D4|Fallout4.esm"]


# -------------------------------------------------------------------------------------------------
# ADVANCED: Weapon-mounted flashlight
# When the light sits on a drawn weapon: whether to require a modeled flashlight, where the beam roots,
# and the two-handed toggle binding.
[ImFl_WeaponMount]

# Optionally require a modeled flashlight on the equipped weapon before the light may mount on it.
# If the weapon has no flashlight the weapon light is turned off.
#   0 = Disabled   - no restriction (the weapon light always applies)
#   1 = Enabled    - always require a modeled flashlight mesh on the weapon
#   2 = AutoDetect - require it only when a supported weapon mod is installed (see the plugin list below)
iWeaponFlashlightMeshRequired = 2

# Plugins that turn the requirement on under AutoDetect (mode 2).
aWeaponFlashlightAutoDetectPlugins = ["VRCP_DOOMMerged.esp", "TacticalMods.esp"]

# Move the weapon beam onto the modeled flashlight mesh instead of the generic barrel position.
bWeaponFlashlightMountBeamToMesh = true

# Anchor the primary-hand activation sphere to the modeled flashlight mesh (instead of the primary-hand
# wand) so the move/toggle gesture is reached by bringing the offhand to the gun's lamp.
bWeaponFlashlightAnchorPrimaryHandSphereToMesh = true

# Flashlight mesh node names to search for under the equipped weapon, in priority order.
aWeaponFlashlightMeshNodes = ["AddOnNode"]

# Light-node offset relative to the found flashlight mesh node, when the beam is rooted there.
tWeaponFlashlightMountTransform = { pos = [0.0, 0.0, 0.0], scale = 1.0 }

# Toggle the weapon-mounted light from anywhere while gripping the weapon two-handed.
# Only active when the light is / would be on the weapon.
kToggleWeaponFlashlightTwoHandedBinding = { hand = "offhand", type = "tap", button = "trigger" }


# -------------------------------------------------------------------------------------------------
# ADVANCED: Body stow model (the grab source for the body activation sphere)
# A beam-less flashlight model sits on your body while the light is off, so you can reach a hand into its
# grab zone and take the light into that hand (see the [ImFl_BodyActivationSphere] section below). Set
# bShowAllActivationSpheres (top section) to see every zone while tuning. Transforms are right-handed and
# auto-mirrored when left-handed.
[ImFl_BodyStow]

# Show the stowed model on the body (also enables the body grab).
bShowFlashlightOnBody = true

# Stowed model transform on the chest bone (+PA variant).
tFlashlightBodyTransform = { pos = [-10.12, 8.71, 8.58], rot = [46.9, -3.25, -14.13], scale = 1.4 }
tFlashlightBodyTransformPA = { pos = [-0.41, 15.14, 11.94], rot = [43.79, 0.0, -7.12], scale = 1.5 }


# -------------------------------------------------------------------------------------------------
# ADVANCED: NPC light detection
# Vanilla NPCs ignore your flashlight beam (the engine only checks how lit YOU are, and a spot light
# points away from you). With this on, NPCs actually inside your beam - with clear line of sight -
# notice it and investigate toward the light source, and NPCs next to the bright patch your beam
# paints on a wall or floor react to the patch. Directional and LOS-gated: beam at the floor or
# behind a wall alerts no one. Watch your beam discipline when sneaking!
[ImFl_NpcDetection]

# Master toggle for the whole feature.
bNpcDetectionEnabled = true

# Only alert NPCs while you are sneaking (false = the beam always matters).
bNpcDetectionOnlyWhenSneaking = false

# Only NPCs hostile to you react to your beam - raiders, ghouls, creatures. Keeps the few line-of-sight
# checks each tick can afford aimed at real threats instead of settlers and townsfolk standing in the way.
# Set false and everyone reacts (a Diamond City guard notices your beam too), but a crowd of neutrals can
# then crowd out the enemy behind them. Companions/teammates are always ignored either way.
bNpcDetectionOnlyHostileNpcs = true

# How often (milliseconds) the beam is checked against nearby NPCs while the light is on.
iNpcDetectionIntervalMs = 1000

# Enable the direct-on-NPC detection path (the event placed near an NPC standing in your beam).
# Turn off to debug the lit-spot path on its own without losing the tuned sound level below.
bNpcDetectionDirectEnabled = true

# How alarming a direct beam hit on an NPC is (0-500, same scale as Papyrus CreateDetectionEvent;
# 0 disables direct hits). Scaled by the beam's strength at the target - distance falloff over the
# location's FULL visual radius times its fade - so the strong long-throw hand torch is noticed
# harder at the same distance than the dim short head lamp.
iNpcDetectionDirectSoundLevel = 100

# Enable the lit-spot detection path (the event placed where the beam paints world geometry when it
# touches no one). Independently toggleable from the direct path for debugging.
bNpcDetectionLitSpotEnabled = true

# How alarming the lit patch the beam paints on world geometry is, when it touches no one directly
# (0 disables the lit-spot reaction). Scaled by beam strength like the direct hit.
iNpcDetectionLitSpotSoundLevel = 40

# Max distance (game units, ~100 per 1.4m) at which the beam can alert anyone, regardless of how far
# the visual beam reaches.
fNpcDetectionMaxRange = 4000.0

# Fraction of the visual beam cone that counts as "lit" - 1.0 alerts at the dim outer edge of the
# beam, lower values only at the bright core.
fNpcDetectionFovMult = 0.5

# Shine a bright beam into a hostile's face from close range and it SEES you: instead of being sent to
# investigate a spot near itself, it is told where YOU are and comes straight at you. Requires the NPC
# to be facing you. This is the value that controls how hard the beam has to land.
iNpcDetectionSpottedEventLevel = 100

# Collision filter (hex) for the raycast checking the beam reaches an NPC, and where it lands on
# geometry; low 7 bits are the collision layer. Default is the game's own item-picker filter.
sNpcDetectionLosCollisionFilter = "02420028"

# Putting your beam on someone makes you VISIBLE, not just heard - vanilla never counts a flashlight
# against you, so enemies can now spot you normally instead of only investigating a noise.
bNpcDetectionLightLevelEnabled = true

# How lit you look just for having the light on - beam on someone or not, sneaking or not, since carrying
# a light gives you away by itself. Keep below Min, or a weak hit is no worse than just holding the light.
fNpcDetectionLightLevelBaseline = 40.0

# How lit you are made to look, on the game's scale: ~20-40 dim interior, ~150 under a street light, ~400
# bright indoors. Min = weak or distant hit, max = point blank. This is YOUR light, so EVERY NPC sees it.
fNpcDetectionLightLevelMin = 70.0
fNpcDetectionLightLevelMax = 220.0

# How fast you brighten as the beam closes in: 1 = straight line, higher = stay dim until it's close.
# Beam strength falls off slowly over its own reach, so a straight line leaves you bright even far away.
fNpcDetectionLightLevelCurve = 1.0

# How long (milliseconds) that fades away once the beam leaves, so sweeping the light past someone doesn't
# switch your visibility on and off abruptly.
fNpcDetectionLightLevelDecayMs = 1000.0


# -------------------------------------------------------------------------------------------------
# ADVANCED: Activation-sphere gestures
# Each gesture is one section below: a zone (tZone / optional tZonePA), two bindings (kPrimaryBinding /
# kSecondaryBinding), haptics (sEntryHaptic / sPrimaryHaptic / sSecondaryHaptic), and two visuals, each with
# its own when-to-show (never | always | wheninside | whenavailable - the last: while the gesture can fire):
# - an icon at the zone's center (sShowIcon, sIcon = a .dds, cIconColor = { rgb = [r, g, b], alpha = a } 0..255, fIconSize)
# - a glowing sphere (sShowSphere, sSphereStyle = a preset such as "cyan-subtle", fSphereScale = size vs the zone)
# A binding (k...) is { hand = "offhand", type = "tap", button = "grip" }, with an optional duration (seconds),
# suppress (true/false) and modifier = { hand = "offhand", button = "grip" }. { type = "none" } turns it off.
# https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/input-binding.md
#

# Body grab: reach a hand into the belt-stowed model's grab zone and fire to take/return the light.
# kPrimaryBinding = offhand grab, kSecondaryBinding = primary-hand grab. Zone auto-mirrored when left-handed;
# tZonePA is the power-armor variant (defaults to tZone).
[ImFl_BodyActivationSphere]
tZone = { pos = [3.91, 7.11, 0.67], scale = 20.0 }
tZonePA = { pos = [4.01, 10.21, -4.6], scale = 24.0 }
kPrimaryBinding = { hand = "offhand", type = "tap", button = "trigger", suppress = true }
kSecondaryBinding = { hand = "primary", type = "tap", button = "trigger", suppress = true }
sEntryHaptic = "Tick"
sPrimaryHaptic = "DoubleClick"
sSecondaryHaptic = "DoubleClick"
sShowIcon = "wheninside"
sIcon = "activation-icon-flashlight.dds"
fIconSize = 2.0


# Head activation: bring the OFFHAND near the HMD. kPrimaryBinding (tap) puts the light on the head / toggles
# it off; kSecondaryBinding (long-press) pulls a head-mounted light to the offhand. Zone is HMD-local (not
# mirrored, no PA variant). Its center is right in front of your eyes, so both visuals are off.
[ImFl_HeadActivationSphere]
tZone = { pos = [0.28, 6.74, 4.15], rot = [-1.09, -0.07, 3.86], scale = 18.0 }
kPrimaryBinding = { hand = "offhand", type = "tap", button = "trigger", suppress = true }
kSecondaryBinding = { hand = "offhand", type = "longpress", button = "trigger", suppress = true }
sEntryHaptic = "Tick"
sPrimaryHaptic = "DoubleClick"
sSecondaryHaptic = "DoubleClick"
sShowIcon = "never"


# Primary-hand activation: bring the OFFHAND near the primary hand. kPrimaryBinding (tap) moves the light
# between the offhand and the primary hand / weapon and toggles the on-weapon light; kSecondaryBinding
# (long-press) pulls the on-weapon light to the offhand. Zone is primary-hand-local (not mirrored, no PA
# variant); only its scale is used when the sphere is anchored to a weapon flashlight mesh.
[ImFl_PrimaryHandActivationSphere]
tZone = { pos = [-2.5, -1.21, -1.02], scale = 20.0 }
kPrimaryBinding = { hand = "offhand", type = "tap", button = "trigger", suppress = true }
kSecondaryBinding = { hand = "offhand", type = "longpress", button = "trigger", suppress = true }
sEntryHaptic = "Tick"
sPrimaryHaptic = "DoubleClick"
sSecondaryHaptic = "DoubleClick"
sShowIcon = "wheninside"
sIcon = "activation-icon-flashlight.dds"
fIconSize = 1.0


# -------------------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------------------
# ADVANCED: Developer and Debugging
[Debug]

# The level of log message to output; 2 - info (basic), 1 - debug (more logs), 0 - trace (A LOT of logs)
iLogLevel = 2

# Sets the spdlog output pattern for each normal log message.
# Examples: "%H:%M:%S.%e %l: %v"; "%H:%M:%S %L [%s:%#]: %v"
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
sLogPattern = "%H:%M:%S.%e %l [%-20!k] %v"

# Mod-defined numeric scratch values for runtime experiments.
fFlowFlag1 = 0.0
fFlowFlag2 = 0.0
fFlowFlag3 = 0.0
# Mod-defined text scratch values; sFlowText1 also supplies haptictest sequences.
sFlowText1 = ""
sFlowText2 = ""

# Mod-defined scratch transform, read as config->debug.transform; tune it in-game with sAdjustTarget = "transform".
# Format: { pos = [x, y, z], rot = [heading, roll, attitude], scale = s }, rotation in degrees, each key optional.
tTransform = { pos = [0.0, 0.0, 0.0], rot = [0.0, 0.0, 0.0], scale = 1.0 }

# Selects an in-game live-tuning target; "none" or "" disables it and restores controller input.
# Examples: "flag123"; "haptictest"; "ImFl_HandMount::tFlashlightInOffhandTransform"
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
sAdjustTarget = "none"

# Writes named game-state dumps to the mod log and removes each name after it runs.
# Examples: ["ui_tree"]; ["skelly", "fp_skelly"]; ["geometry", "pipboy", "all_nodes"]; ["headgear"]
# Timing: "perf_reset" starts a perf window, then "perf" logs what each part of the frame cost since
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
aDumpDataOnce = []

# In-world debug draw overlay: master switch, names of the channels to skip (e.g. ["npc-detection"]),
# and a controller binding to enable/disable the overlay in-headset.
# HUD placement: center, center-left, center-right, center-top, center-top-left, center-top-right.
bDebugDrawEnabled = false
kDebugDrawToggleBinding = { hand = "offhand", type = "longpress", button = "a" }
aDebugDrawDisabledChannels = []
sDebugDrawHudPlacement = "center-top-left"

# Mark the fingertip that presses the VR UI buttons with a small sphere.
# Without it the sphere is shown only while no hand is drawn at the controller (no FRIK).
bVRUIShowFingerTip = false

# Tune the placement of the attached VR UI through a dev layout file of its own while the game runs.
bVRUIDevLayout = false

# Internal use for versioning
iVersion = 1
