[pytest]
testpaths = .
addopts = -p no:cacheprovider
markers =
    light: the light action: locations, on and off, each location's beam
    gestures: the gestures' transitions, fired through their gating without zone and button
    overrides: the config's session overrides on the live light
    headgear: the headgear restriction
    menus: game menus blocking the gestures, and the config UI
    weapon: the weapon mount and its lamp requirement
    powerarmor: power armor in and out, at once and stepping in and out (devbench player)
    controllers: the gestures for real: a controller placed into each zone, its trigger pressed (devbench input pose)
    health: the stowed model, the per-frame cost, the log
